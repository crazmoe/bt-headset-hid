# deb and rpm packages, built by .github/workflows/release.yml with
# VERSION and ARCH (amd64, arm64) set. The package ships the program, the
# user service and docs; postinstall runs "bt-headset-hid install
# -system-only", which writes the mode-dependent files, and the user service
# sets up each user's PipeWire at login.
name: bt-headset-hid
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: utils
priority: optional
maintainer: crazmoe <225934907+crazmoe@users.noreply.github.com>
homepage: https://github.com/crazmoe/bt-headset-hid
license: MIT
description: |
  Bluetooth headset buttons as HID telephony device.
  Softphones see a USB-dongle-like HID telephony device that reports
  answer and hang-up from a Bluetooth headset.
recommends:
  - bluez
  - wireplumber

scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh

# contents stays last: release.yml appends nfpm-repo.yaml to it.
contents:
  - src: build/bt-headset-hid
    dst: /usr/bin/bt-headset-hid
    file_info:
      mode: 0755
  - src: packaging/bt-headset-hid-session.service
    dst: /usr/lib/systemd/user/bt-headset-hid-session.service
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/bt-headset-hid/README.md
  - src: README.de.md
    dst: /usr/share/doc/bt-headset-hid/README.de.md
  - src: docs/ADVANCED.md
    dst: /usr/share/doc/bt-headset-hid/ADVANCED.md
  - src: docs/ADVANCED.de.md
    dst: /usr/share/doc/bt-headset-hid/ADVANCED.de.md
  - src: CHANGELOG.md
    dst: /usr/share/doc/bt-headset-hid/CHANGELOG.md
  - src: LICENSE
    dst: /usr/share/doc/bt-headset-hid/LICENSE
  - src: contrib/
    dst: /usr/share/doc/bt-headset-hid/contrib/
    type: tree
