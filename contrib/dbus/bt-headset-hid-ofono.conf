<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Install as /etc/dbus-1/system.d/bt-headset-hid.conf (mode ofono only).
     Lets the daemon (running as root) pose as oFono and lets PipeWire, which
     runs as the logged-in user, take the call audio from it. Do not install
     this while the real oFono is in use. ModemManager is not affected. -->
<busconfig>
  <policy user="root">
    <allow own="org.ofono"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ofono"/>
  </policy>
</busconfig>
