<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Install as /etc/dbus-1/system.d/bt-headset-hid.conf (mode pipewire only).
     Lets the daemon (running as root) pose as ModemManager and lets PipeWire,
     which runs as the logged-in user, call it. Do not install this while the
     real ModemManager is in use. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.ModemManager1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.ModemManager1"/>
  </policy>
</busconfig>
