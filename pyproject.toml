[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-headset-hid"
version = "0.1.0"
description = "Bridges Bluetooth headset AT commands (HFP/HSP) to a virtual USB-style HID telephony device via /dev/uhid"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["dbus-fast>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
bt-headset-hid = "bt_headset_hid.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
