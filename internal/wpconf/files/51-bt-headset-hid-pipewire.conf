# Mode pipewire, WirePlumber 0.5+:
# ~/.config/wireplumber/wireplumber.conf.d/51-bt-headset-hid.conf
# PipeWire keeps HFP and forwards answer/hang-up to the "modem" bt-headset-hid provides.
monitor.bluez.properties = {
  bluez5.hfphsp-backend = "native"
  bluez5.hfphsp-backend-native-modem = "any"
}
