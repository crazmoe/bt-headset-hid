name: Bug report
description: Something does not work as described in the README.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the troubleshooting section of the README first.
        English or German is fine. Do not post security problems here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Incoming call in Teams
        2. Pressed the call button on the headset
        3. Expected: the call is answered. Actual: nothing happens, the headset keeps ringing.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - pipewire
        - hfp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bt-headset-hid version
      description: Output of `bt-headset-hid -version`, or the commit if you built it yourself.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      description: Name and version, e.g. from `grep PRETTY_NAME /etc/os-release`.
      placeholder: Ubuntu 24.04, Fedora 41, Arch, ...
    validations:
      required: true
  - type: input
    id: pipewire
    attributes:
      label: PipeWire and WirePlumber version
      description: Output of `pipewire --version` and `wireplumber --version`. Say if you use `contrib/pipewire-1.0-fix.sh`.
      placeholder: PipeWire 1.2.7, WirePlumber 0.5.6
    validations:
      required: true
  - type: input
    id: bluez
    attributes:
      label: BlueZ version
      description: Output of `bluetoothctl --version`.
  - type: input
    id: headset
    attributes:
      label: Headset model
      placeholder: Jabra Evolve2 65
    validations:
      required: true
  - type: input
    id: softphone
    attributes:
      label: Softphone
      description: Name and version, and for browser apps the browser.
      placeholder: Teams in Chrome 130, Zoom 6.2, ...
    validations:
      required: true
  - type: textarea
    id: journal
    attributes:
      label: Journal output
      description: |
        Output of `journalctl -u bt-headset-hid -b --no-pager` around the problem (start from connecting the
        headset). In `-mode pipewire` the WirePlumber log helps too: `journalctl --user -u wireplumber -b --no-pager`.
        You may replace the Bluetooth addresses.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Other Bluetooth or audio software (oFono, hsphfpd, PulseAudio), workarounds you tried, ...
