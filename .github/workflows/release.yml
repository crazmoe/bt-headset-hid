name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          mkdir dist
          for arch in amd64 arm64; do
            name="bt-headset-hid_${version}_linux_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "build/$name/bt-headset-hid" ./cmd/bt-headset-hid
            cp -r LICENSE README.md README.de.md contrib "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # 0.x versions and tags like v1.0.0-rc1 are marked as pre-release.
        run: |
          set -eu
          pre=""
          case "$TAG" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes $pre
