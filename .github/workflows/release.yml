name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/build.sh "${TAG#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # 0.x versions and tags like v1.0.0-rc1 are marked as pre-release.
        run: |
          set -eu
          pre=""
          case "$TAG" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes $pre
